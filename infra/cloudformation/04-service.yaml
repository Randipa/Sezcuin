AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Sezcuin - Application tier. Internet-facing Application Load Balancer with
  path-based routing (/api -> backend, everything else -> frontend) and the
  backend/frontend services running on Fargate in private subnets.

Parameters:
  ProjectName:
    Type: String
    Default: sezcuin
  BackendImage:
    Type: String
    Description: Full ECR image URI (including tag) for the backend.
  FrontendImage:
    Type: String
    Description: Full ECR image URI (including tag) for the frontend.
  BackendContainerPort:
    Type: Number
    Default: 3000
  FrontendContainerPort:
    Type: Number
    Default: 3002
  BackendCpu:
    Type: String
    Default: '256'
  BackendMemory:
    Type: String
    Default: '512'
  FrontendCpu:
    Type: String
    Default: '256'
  FrontendMemory:
    Type: String
    Default: '512'
  DesiredCount:
    Type: Number
    Default: 1
  LogRetentionDays:
    Type: Number
    Default: 30

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public entry point for the Sezcuin load balancer.
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Public HTTP.
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Forward traffic to targets.
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-alb-sg'

  BackendFromAlbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub '${ProjectName}-AppTasksSecurityGroupId'
      IpProtocol: tcp
      FromPort: !Ref BackendContainerPort
      ToPort: !Ref BackendContainerPort
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: Allow ALB to reach the backend container.

  FrontendFromAlbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub '${ProjectName}-AppTasksSecurityGroupId'
      IpProtocol: tcp
      FromPort: !Ref FrontendContainerPort
      ToPort: !Ref FrontendContainerPort
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: Allow ALB to reach the frontend container.

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-alb'
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets:
        - Fn::ImportValue: !Sub '${ProjectName}-PublicSubnet1Id'
        - Fn::ImportValue: !Sub '${ProjectName}-PublicSubnet2Id'

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-backend-tg'
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-VpcId'
      Port: !Ref BackendContainerPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /api/health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '20'

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-frontend-tg'
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-VpcId'
      Port: !Ref FrontendContainerPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /login
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '20'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  ApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /api
              - /api/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}/backend'
      RetentionInDays: !Ref LogRetentionDays

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}/frontend'
      RetentionInDays: !Ref LogRetentionDays

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-app-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - Fn::ImportValue: !Sub '${ProjectName}-DbSecretArn'
                  - Fn::ImportValue: !Sub '${ProjectName}-JwtSecretArn'

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-backend'
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: !Ref BackendCpu
      Memory: !Ref BackendMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ContainerDefinitions:
        - Name: backend
          Image: !Ref BackendImage
          Essential: true
          PortMappings:
            - ContainerPort: !Ref BackendContainerPort
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: !Sub '${BackendContainerPort}'
            - Name: API_GLOBAL_PREFIX
              Value: api
            - Name: CORS_ORIGIN
              Value: !Sub 'http://${LoadBalancer.DNSName}'
            - Name: POSTGRES_HOST
              Value:
                Fn::ImportValue: !Sub '${ProjectName}-PostgresHost'
            - Name: POSTGRES_PORT
              Value: '5432'
            - Name: POSTGRES_DB
              Value:
                Fn::ImportValue: !Sub '${ProjectName}-PostgresDbName'
            - Name: POSTGRES_USER
              Value:
                Fn::ImportValue: !Sub '${ProjectName}-PostgresUserName'
          Secrets:
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Sub
                - '${Arn}:password::'
                - Arn:
                    Fn::ImportValue: !Sub '${ProjectName}-DbSecretArn'
            - Name: JWT_SECRET
              ValueFrom: !Sub
                - '${Arn}:value::'
                - Arn:
                    Fn::ImportValue: !Sub '${ProjectName}-JwtSecretArn'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-frontend'
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: !Ref FrontendCpu
      Memory: !Ref FrontendMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ContainerDefinitions:
        - Name: frontend
          Image: !Ref FrontendImage
          Essential: true
          PortMappings:
            - ContainerPort: !Ref FrontendContainerPort
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: !Sub '${FrontendContainerPort}'
            - Name: HOSTNAME
              Value: 0.0.0.0
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FrontendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend

  BackendService:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpListener
      - ApiListenerRule
      - BackendFromAlbIngress
    Properties:
      ServiceName: !Sub '${ProjectName}-backend'
      Cluster:
        Fn::ImportValue: !Sub '${ProjectName}-ClusterArn'
      TaskDefinition: !Ref BackendTaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - Fn::ImportValue: !Sub '${ProjectName}-PrivateSubnet1Id'
            - Fn::ImportValue: !Sub '${ProjectName}-PrivateSubnet2Id'
          SecurityGroups:
            - Fn::ImportValue: !Sub '${ProjectName}-AppTasksSecurityGroupId'
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: !Ref BackendContainerPort
          TargetGroupArn: !Ref BackendTargetGroup

  FrontendService:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpListener
      - FrontendFromAlbIngress
    Properties:
      ServiceName: !Sub '${ProjectName}-frontend'
      Cluster:
        Fn::ImportValue: !Sub '${ProjectName}-ClusterArn'
      TaskDefinition: !Ref FrontendTaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - Fn::ImportValue: !Sub '${ProjectName}-PrivateSubnet1Id'
            - Fn::ImportValue: !Sub '${ProjectName}-PrivateSubnet2Id'
          SecurityGroups:
            - Fn::ImportValue: !Sub '${ProjectName}-AppTasksSecurityGroupId'
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: !Ref FrontendContainerPort
          TargetGroupArn: !Ref FrontendTargetGroup

Outputs:
  LoadBalancerDNS:
    Value: !GetAtt LoadBalancer.DNSName
    Export:
      Name: !Sub '${ProjectName}-LoadBalancerDNS'
  ApplicationUrl:
    Value: !Sub 'http://${LoadBalancer.DNSName}'
  BackendServiceName:
    Value: !GetAtt BackendService.Name
    Export:
      Name: !Sub '${ProjectName}-BackendServiceName'
  FrontendServiceName:
    Value: !GetAtt FrontendService.Name
    Export:
      Name: !Sub '${ProjectName}-FrontendServiceName'
