name: Deploy to AWS ECS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Bootstrap AWS (ECS + ECR)"]
    types: [completed]

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  STACK_NAME: sezcuin-test

jobs:
  deploy:
    name: Build, push, deploy ECS
    runs-on: ubuntu-latest
    # Skip auto-deploy if bootstrap workflow failed
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check infrastructure exists
        id: infra
        run: |
          if aws cloudformation describe-stacks \
            --stack-name "${{ env.STACK_NAME }}" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null | grep -qE 'CREATE_COMPLETE|UPDATE_COMPLETE'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Run **Bootstrap AWS (ECS + ECR)** workflow first. Infrastructure stack not found yet."
          fi

      - name: Login to Amazon ECR
        if: steps.infra.outputs.ready == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Load stack outputs
        if: steps.infra.outputs.ready == 'true'
        id: stack
        run: |
          OUTPUTS="$(aws cloudformation describe-stacks \
            --stack-name "${{ env.STACK_NAME }}" \
            --query 'Stacks[0].Outputs' \
            --output json)"

          for key in backend_repo frontend_repo api_url app_url cluster backend_service frontend_service task_def subnets sg; do
            case $key in
              backend_repo)   out_key=BackendRepositoryUri ;;
              frontend_repo)  out_key=FrontendRepositoryUri ;;
              api_url)        out_key=ApiUrl ;;
              app_url)        out_key=AppUrl ;;
              cluster)        out_key=EcsClusterName ;;
              backend_service) out_key=BackendServiceName ;;
              frontend_service) out_key=FrontendServiceName ;;
              task_def)       out_key=BackendTaskDefinitionArn ;;
              subnets)        out_key=PublicSubnetIds ;;
              sg)             out_key=EcsSecurityGroupId ;;
            esac
            echo "${key}=$(echo "$OUTPUTS" | jq -r ".[] | select(.OutputKey==\"${out_key}\") | .OutputValue")" >> "$GITHUB_OUTPUT"
          done

      - name: Build and push backend
        if: steps.infra.outputs.ready == 'true'
        run: |
          IMAGE="${{ steps.stack.outputs.backend_repo }}"
          docker build -f infra/docker/Dockerfile.backend -t "${IMAGE}:latest" backend
          docker push "${IMAGE}:latest"

      - name: Build and push frontend
        if: steps.infra.outputs.ready == 'true'
        run: |
          IMAGE="${{ steps.stack.outputs.frontend_repo }}"
          docker build -f infra/docker/Dockerfile.frontend \
            --build-arg "NEXT_PUBLIC_API_URL=/api" \
            -t "${IMAGE}:latest" frontend
          docker push "${IMAGE}:latest"

      - name: Deploy to ECS
        if: steps.infra.outputs.ready == 'true'
        run: |
          CLUSTER="${{ steps.stack.outputs.cluster }}"
          BACKEND="${{ steps.stack.outputs.backend_service }}"
          FRONTEND="${{ steps.stack.outputs.frontend_service }}"

          aws ecs update-service --cluster "$CLUSTER" --service "$BACKEND" \
            --desired-count 1 --force-new-deployment
          aws ecs update-service --cluster "$CLUSTER" --service "$FRONTEND" \
            --desired-count 1 --force-new-deployment

          echo "Waiting for backend..."
          if ! aws ecs wait services-stable --cluster "$CLUSTER" --services "$BACKEND"; then
            echo "::error::Backend service failed to stabilize"
            TASK="$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$BACKEND" \
              --desired-status STOPPED --query 'taskArns[0]' --output text)"
            if [[ "$TASK" != "None" && -n "$TASK" ]]; then
              aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" \
                --query 'tasks[0].{reason:stoppedReason,exit:containers[0].exitCode,reason2:containers[0].reason}' \
                --output json
            fi
            aws logs tail "/ecs/sezcuin-test/backend" --since 30m || true
            exit 1
          fi

          echo "Waiting for frontend..."
          if ! aws ecs wait services-stable --cluster "$CLUSTER" --services "$FRONTEND"; then
            echo "::error::Frontend service failed to stabilize"
            TASK="$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$FRONTEND" \
              --desired-status STOPPED --query 'taskArns[0]' --output text)"
            if [[ "$TASK" != "None" && -n "$TASK" ]]; then
              aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" \
                --query 'tasks[0].{reason:stoppedReason,exit:containers[0].exitCode,reason2:containers[0].reason}' \
                --output json
            fi
            aws logs tail "/ecs/sezcuin-test/frontend" --since 30m || true
            exit 1
          fi

      - name: Seed admin account
        if: steps.infra.outputs.ready == 'true'
        continue-on-error: true
        run: |
          TASK_ARN="$(aws ecs run-task \
            --cluster "${{ steps.stack.outputs.cluster }}" \
            --task-definition "${{ steps.stack.outputs.task_def }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ steps.stack.outputs.subnets }}],securityGroups=[${{ steps.stack.outputs.sg }}],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["node","dist/seed.js"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)"

          echo "Seed task: $TASK_ARN"
          aws ecs wait tasks-stopped \
            --cluster "${{ steps.stack.outputs.cluster }}" \
            --tasks "$TASK_ARN"

      - name: Summary
        if: steps.infra.outputs.ready == 'true'
        run: echo "Live at ${{ steps.stack.outputs.app_url }}"
