name: Bootstrap AWS (ECS + ECR)

# Run once from GitHub UI — no local AWS CLI needed.
# GitHub → Actions → Bootstrap AWS → Run workflow

on:
  workflow_dispatch:
    inputs:
      db_master_password:
        description: PostgreSQL password (min 8 chars, no special / @ " space)
        required: true
        type: string
      jwt_secret:
        description: JWT secret (min 16 chars)
        required: true
        type: string
      seed_admin_password:
        description: Admin login password (min 8 chars)
        required: true
        type: string
      seed_admin_email:
        description: Admin email
        required: false
        default: admin@sezcuin.com
        type: string

env:
  AWS_REGION: ap-south-1
  STACK_NAME: sezcuin-test

jobs:
  bootstrap:
    name: Create ECS + ECR + ALB + RDS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --region "${{ env.AWS_REGION }}" \
            --stack-name "${{ env.STACK_NAME }}" \
            --template-file infra/cloudformation/template.yaml \
            --parameter-overrides \
              EnvironmentName="${{ env.STACK_NAME }}" \
              DbMasterUsername=sezcuin \
              DbMasterPassword="${{ inputs.db_master_password }}" \
              JwtSecret="${{ inputs.jwt_secret }}" \
              SeedAdminEmail="${{ inputs.seed_admin_email }}" \
              SeedAdminPassword="${{ inputs.seed_admin_password }}" \
              DesiredCount=0 \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset

      - name: Stack outputs
        run: |
          echo "## Bootstrap complete" >> "$GITHUB_STEP_SUMMARY"
          aws cloudformation describe-stacks \
            --region "${{ env.AWS_REGION }}" \
            --stack-name "${{ env.STACK_NAME }}" \
            --query 'Stacks[0].Outputs' \
            --output table | tee -a "$GITHUB_STEP_SUMMARY"

          APP_URL="$(aws cloudformation describe-stacks \
            --region "${{ env.AWS_REGION }}" \
            --stack-name "${{ env.STACK_NAME }}" \
            --query "Stacks[0].Outputs[?OutputKey=='AppUrl'].OutputValue" \
            --output text)"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Next:** run **Deploy to AWS ECS** workflow (or push to main)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Login: ${{ inputs.seed_admin_email }} / (password you entered)" >> "$GITHUB_STEP_SUMMARY"
          echo "App URL: $APP_URL" >> "$GITHUB_STEP_SUMMARY"
