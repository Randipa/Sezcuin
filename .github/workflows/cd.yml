name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_seed:
        description: Run the one-off database seed task after deploying.
        type: boolean
        default: false

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_NAME: sezcuin
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    # Only deploy when triggered manually or when the CI run that started us succeeded.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Base infrastructure must exist before we can push images: the ECR
      # repositories are the push target. Running this first lets a single push
      # bootstrap a fresh account end to end.
      - name: Provision base infrastructure (network, ECR)
        run: |
          set -euo pipefail
          cd infra/cloudformation
          deploy() {
            local suffix="$1" template="$2"; shift 2
            aws cloudformation deploy \
              --region "${AWS_REGION}" \
              --stack-name "${PROJECT_NAME}-${suffix}" \
              --template-file "${template}" \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-fail-on-empty-changeset \
              --parameter-overrides "ProjectName=${PROJECT_NAME}" "$@"
          }
          deploy network 01-network.yaml
          deploy ecr 02-ecr.yaml

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          BACKEND_IMAGE="${REGISTRY}/${PROJECT_NAME}/backend:${TAG}"
          FRONTEND_IMAGE="${REGISTRY}/${PROJECT_NAME}/frontend:${TAG}"

          # Repositories are immutable; skip the push if this commit was already
          # built (e.g. a re-run of the same workflow).
          build_and_push() {
            local repo="$1" context="$2" image="$3"
            if aws ecr describe-images --repository-name "${PROJECT_NAME}/${repo}" \
                --image-ids imageTag="${TAG}" --region "${AWS_REGION}" >/dev/null 2>&1; then
              echo "Image ${image} already exists, reusing."
              return
            fi
            docker build --platform linux/amd64 -t "${image}" "${context}"
            docker push "${image}"
          }

          build_and_push backend backend "${BACKEND_IMAGE}"
          build_and_push frontend frontend "${FRONTEND_IMAGE}"

          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> "$GITHUB_ENV"

      - name: Provision data tier (secrets, EFS, PostgreSQL)
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --region "${AWS_REGION}" \
            --stack-name "${PROJECT_NAME}-data" \
            --template-file infra/cloudformation/03-data.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides "ProjectName=${PROJECT_NAME}"

      - name: Deploy application stack
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --region "${AWS_REGION}" \
            --stack-name "${PROJECT_NAME}-service" \
            --template-file infra/cloudformation/04-service.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ProjectName=${PROJECT_NAME}" \
              "BackendImage=${BACKEND_IMAGE}" \
              "FrontendImage=${FRONTEND_IMAGE}"

      - name: Report application URL
        run: |
          aws cloudformation describe-stacks \
            --region "${AWS_REGION}" \
            --stack-name "${PROJECT_NAME}-service" \
            --query "Stacks[0].Outputs[?OutputKey=='ApplicationUrl'].OutputValue" \
            --output text

      - name: Seed database (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.run_seed
        env:
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          CLUSTER=$(aws cloudformation describe-stacks --region "${AWS_REGION}" \
            --stack-name "${PROJECT_NAME}-network" \
            --query "Stacks[0].Outputs[?OutputKey=='ClusterName'].OutputValue" --output text)
          SUBNET1=$(aws cloudformation describe-stacks --region "${AWS_REGION}" \
            --stack-name "${PROJECT_NAME}-network" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnet1Id'].OutputValue" --output text)
          SUBNET2=$(aws cloudformation describe-stacks --region "${AWS_REGION}" \
            --stack-name "${PROJECT_NAME}-network" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnet2Id'].OutputValue" --output text)
          SG=$(aws cloudformation describe-stacks --region "${AWS_REGION}" \
            --stack-name "${PROJECT_NAME}-data" \
            --query "Stacks[0].Outputs[?OutputKey=='AppTasksSecurityGroupId'].OutputValue" --output text)

          OVERRIDES=$(cat <<JSON
          {
            "containerOverrides": [{
              "name": "backend",
              "command": ["node", "dist/seed.js"],
              "environment": [
                {"name": "SEED_ADMIN_EMAIL", "value": "${SEED_ADMIN_EMAIL}"},
                {"name": "SEED_ADMIN_PASSWORD", "value": "${SEED_ADMIN_PASSWORD}"}
              ]
            }]
          }
          JSON
          )

          aws ecs run-task \
            --region "${AWS_REGION}" \
            --cluster "${CLUSTER}" \
            --launch-type FARGATE \
            --task-definition "${PROJECT_NAME}-backend" \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNET1},${SUBNET2}],securityGroups=[${SG}],assignPublicIp=DISABLED}" \
            --overrides "${OVERRIDES}"
