version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(backend deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # eslint-config-next / eslint-plugin-react are not ESLint 10-ready yet.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "chore(frontend deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
